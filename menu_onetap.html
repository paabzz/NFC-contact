<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneTap | Restaurant Menu</title>
<style>
:root{--ink:#25342e;--muted:#78857d;--accent:#28664c;--bg:#f7f8f5;--line:#e4e9e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding-bottom:105px}.hero{background:#e9f0e8;padding:30px 24px 24px}.brand{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--accent)}h1{font-size:31px;letter-spacing:-1px;margin:14px 0 4px}p{margin:0;color:#617368}.pill{display:inline-block;margin-top:16px;border:1px solid #b9d0bf;border-radius:30px;padding:5px 12px;color:var(--accent);font-size:12px}.content{padding:24px 20px}.search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:14px;font:inherit;outline-color:var(--accent)}.tabs{display:flex;gap:8px;overflow:auto;padding:18px 0;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:30px;padding:9px 15px;cursor:pointer;color:#506159}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}.heading{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 12px}.heading h2{margin:0;font-size:19px}.heading small{color:var(--muted)}.item{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.emoji{width:74px;height:74px;border-radius:17px;background:#f2f4ed;display:grid;place-items:center;font-size:37px;flex-shrink:0}.details{flex:1;min-width:0}.details h3{margin:0 0 3px;font-size:15px}.details p{font-size:12px}.price{font-weight:750;color:var(--accent);margin-top:7px}.add{border:0;background:#e5f1e9;color:var(--accent);border-radius:11px;width:36px;height:36px;font-size:23px;cursor:pointer}.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:14px 20px 20px;background:#fff;border-top:1px solid var(--line)}.cartbtn{width:100%;border:0;border-radius:13px;background:var(--accent);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;font-weight:700;cursor:pointer}.overlay{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:#fff;border-radius:22px 22px 0 0;padding:24px;width:min(520px,100%);max-height:80vh;overflow:auto}.sheet h2{margin:0 0 12px}.cartline{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.qty button{border:1px solid var(--line);background:white;border-radius:7px;width:28px;height:28px;cursor:pointer}.qty{display:flex;align-items:center;gap:10px}.actions{display:flex;gap:8px;margin-top:20px}.actions button{padding:13px;border:0;border-radius:10px;cursor:pointer}.close{background:#edf0ed;flex:1}.checkout{background:var(--accent);color:#fff;flex:2}.empty{color:var(--muted);padding:20px 0}.note{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="app"><header class="hero"><div class="brand">ONETAP · DIGITAL MENU</div><h1>Olive & Basil</h1><p>Fresh flavors. Good moments.</p><span class="pill">✦ Welcome! Explore our menu</span></header><main class="content"><input class="search" id="search" placeholder="Search food or drinks…" aria-label="Search menu"><nav class="tabs" id="tabs" aria-label="Menu categories"></nav><div class="heading"><h2 id="section">Our Menu</h2><small id="count"></small></div><div id="items"></div></main><footer class="footer"><button class="cartbtn" id="cartOpen"><span>🛍 View order <span id="cartCount">(0)</span></span><span id="cartTotal">₱0</span></button></footer></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Your order"><div class="sheet"><h2>Your order</h2><div id="cartItems"></div><div class="cartline"><strong>Total</strong><strong id="sheetTotal">₱0</strong></div><div class="actions"><button class="close" id="close">Close</button><button class="checkout" id="checkout">Place demo order</button></div><p class="note">Presentation demo only · No payment or order is sent</p></div></div>
<script>
const menu=[
{id:1,name:'Truffle Mushroom Pasta',desc:'Creamy parmesan sauce, mushrooms, herbs',price:285,cat:'Mains',emoji:'🍝'},
{id:2,name:'Grilled Chicken Plate',desc:'Herb-marinated chicken with rice',price:320,cat:'Mains',emoji:'🍗'},
{id:3,name:'Classic Cheeseburger',desc:'Beef patty, cheddar, house sauce',price:245,cat:'Mains',emoji:'🍔'},
{id:4,name:'Margherita Pizza',desc:'Tomato, mozzarella, fresh basil',price:350,cat:'Mains',emoji:'🍕'},
{id:5,name:'Garden Salad',desc:'Crisp greens, cucumber, citrus dressing',price:175,cat:'Starters',emoji:'🥗'},
{id:6,name:'Crispy Fries',desc:'Golden fries with signature dip',price:120,cat:'Starters',emoji:'🍟'},
{id:7,name:'Iced Spanish Latte',desc:'Espresso, milk, sweet cream',price:155,cat:'Drinks',emoji:'☕'},
{id:8,name:'Fresh Lemonade',desc:'Fresh lemon, mint, sparkling water',price:110,cat:'Drinks',emoji:'🍋'},
{id:9,name:'Chocolate Brownie',desc:'Warm brownie with vanilla ice cream',price:185,cat:'Desserts',emoji:'🍫'},
{id:10,name:'Strawberry Cheesecake',desc:'Creamy cheesecake, berry topping',price:195,cat:'Desserts',emoji:'🍰'}
];
let category='All',query='';const cart={};const money=n=>'₱'+n.toLocaleString('en-PH');const $=id=>document.getElementById(id);
function render(){const categories=['All','Mains','Starters','Drinks','Desserts'];$('tabs').innerHTML=categories.map(c=>`<button class="tab ${c===category?'active':''}" data-cat="${c}">${c}</button>`).join('');const shown=menu.filter(x=>(category==='All'||x.cat===category)&&(x.name+' '+x.desc).toLowerCase().includes(query));$('section').textContent=category==='All'?'Our Menu':category;$('count').textContent=shown.length+' items';$('items').innerHTML=shown.length?shown.map(x=>`<article class="item"><div class="emoji" aria-hidden="true">${x.emoji}</div><div class="details"><h3>${x.name}</h3><p>${x.desc}</p><div class="price">${money(x.price)}</div></div><button class="add" data-add="${x.id}" aria-label="Add ${x.name}">+</button></article>`).join(''):'<p class="empty">No matching menu items.</p>';$('cartCount').textContent='('+Object.values(cart).reduce((a,b)=>a+b,0)+')';$('cartTotal').textContent=money(total());}
function total(){return menu.reduce((sum,x)=>sum+x.price*(cart[x.id]||0),0)}
function renderCart(){const selected=menu.filter(x=>cart[x.id]);$('cartItems').innerHTML=selected.length?selected.map(x=>`<div class="cartline"><div><strong>${x.name}</strong><div>${money(x.price*cart[x.id])}</div></div><div class="qty"><button data-minus="${x.id}" aria-label="Remove one ${x.name}">−</button><span>${cart[x.id]}</span><button data-add="${x.id}" aria-label="Add one ${x.name}">+</button></div></div>`).join(''):'<p class="empty">Your order is empty. Add something delicious!</p>';$('sheetTotal').textContent=money(total());}
document.addEventListener('click',e=>{const c=e.target.closest('[data-cat]'),a=e.target.closest('[data-add]'),m=e.target.closest('[data-minus]');if(c){category=c.dataset.cat;render()}if(a){const id=a.dataset.add;cart[id]=(cart[id]||0)+1;render();renderCart()}if(m){const id=m.dataset.minus;cart[id]--;if(!cart[id])delete cart[id];render();renderCart()}});
$('search').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();render()});$('cartOpen').onclick=()=>{$('overlay').classList.add('show');renderCart()};$('close').onclick=()=>$('overlay').classList.remove('show');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('overlay').classList.remove('show')});$('checkout').onclick=()=>{if(!Object.keys(cart).length){alert('Please add an item first.');return}alert('Demo order placed! No real order was sent.');Object.keys(cart).forEach(k=>delete cart[k]);$('overlay').classList.remove('show');render()};render();
</script>
</body></html>
